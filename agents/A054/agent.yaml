id: A054
name: Qualification
version: "1.0"
status: implementation
category: sales_ops
purpose: Apply qualification criteria to scored leads and conversation signals; produce qualification status and handoff recommendation.
inputs:
  required: [scored_leads, qualification_scoring_strategy]
  optional: [triage_result, conversation_context, qualification_constraints]
outputs:
  primary: qualification_result
  required_fields: [status_per_lead, criteria_met, handoff_recommendation, confidence, assumptions, derived_from]
  downstream_events: [qualification.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, apply_criteria, determine_status, recommend_handoff, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - status_traceable_to_criteria
  - handoff_recommendation_is_actionable
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A054 Qualification)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
