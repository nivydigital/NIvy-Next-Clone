id: A041
name: Account Research
version: "1.0"
status: implementation
category: lead_ops
purpose: Research target accounts for signals, context and talking points to support outreach and qualification.
inputs:
  required: [scored_leads]
  optional: [icp_definition, competitor_intelligence, research_constraints]
outputs:
  primary: account_research
  required_fields: [accounts, signals, talking_points, sources, confidence, assumptions, derived_from]
  downstream_events: [account_research.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, research_accounts, extract_signals, draft_talking_points, attach_sources, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - research_is_source_backed
  - signals_and_talking_points_are_actionable
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A041 Account Research)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
