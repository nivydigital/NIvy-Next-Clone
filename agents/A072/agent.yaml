id: A072
name: Customer Onboarding Planner
version: "1.0"
status: implementation
category: customer_success
purpose: Refine operational onboarding plan from A065 output and customer context into timed tasks and owners.
inputs:
  required: [onboarding_plan]
  optional: [account_research, customer_profile, planning_constraints]
outputs:
  primary: onboarding_schedule
  required_fields: [tasks, timeline, owners, checkpoints, confidence, assumptions, derived_from]
  downstream_events: [onboarding_schedule.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, expand_tasks, set_timeline, assign_owners, define_checkpoints, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - schedule_is_actionable
  - owners_and_checkpoints_are_explicit
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A072 Customer Onboarding Planner)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
