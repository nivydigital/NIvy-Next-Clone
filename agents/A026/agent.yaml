id: A026
name: Pricing Governance Strategy Agent
version: "1.0"
status: implementation
category: revenue_ops
purpose: Define pricing approval paths, discount guardrails, exception handling and review cadence from offer and RevOps strategy.
inputs:
  required: [offer_pricing_strategy, revenue_operations_strategy]
  optional: [pipeline_deal_strategy, pricing_constraints]
outputs:
  primary: pricing_governance_strategy
  required_fields: [approval_paths, discount_guardrails, exception_handling, review_cadence, escalation_rules, confidence, assumptions, derived_from]
  downstream_events: [pricing_governance_strategy.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, define_approval_paths, set_guardrails, define_exceptions, set_review_cadence, set_escalation, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - governance_aligns_with_offer_and_RevOps
  - guardrails_and_exceptions_are_explicit
  - assumptions_are_stated
provenance:
  source: sequential strategy chain after A025
  source_type: internal
  modifications: "Created under deferred-testing policy."
