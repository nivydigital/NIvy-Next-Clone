id: A074
name: Support Triage
version: "1.0"
status: implementation
category: customer_success
purpose: Triage support tickets by severity, category and recommended queue or playbook.
inputs:
  required: [support_ticket]
  optional: [customer_health, triage_rules, triage_constraints]
outputs:
  primary: support_triage
  required_fields: [severity, category, route_to, playbook, confidence, assumptions, derived_from]
  downstream_events: [support_triage.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, classify_category, set_severity, recommend_route, select_playbook, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - severity_and_category_are_explicit
  - route_and_playbook_are_actionable
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A074 Support Triage)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
