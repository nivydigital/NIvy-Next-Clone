id: A070
name: Communication Knowledge Extractor
version: "1.0"
status: implementation
category: communications
purpose: Extract reusable knowledge, FAQs, objections and playbook snippets from conversations and meetings.
inputs:
  required: [conversation_insights]
  optional: [meeting_intelligence, knowledge_constraints]
outputs:
  primary: knowledge_extract
  required_fields: [faqs, objection_handlers, playbook_snippets, tags, confidence, assumptions, derived_from]
  downstream_events: [knowledge_extract.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, extract_faqs, extract_objections, draft_playbook, tag, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - extracts_are_traceable_to_source
  - tags_and_snippets_are_usable
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A070 Communication Knowledge Extractor)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
