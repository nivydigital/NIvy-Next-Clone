id: A097
name: Resource Planning Analyst
version: "1.0"
status: implementation
category: control
purpose: Plan capacity and allocation of people, agents and compute for planned work — forecasts and constraints — without changing live schedules or infra.
inputs:
  required: [demand_forecast, resource_inventory]
  optional: [constraints, priority_policy, historical_utilization, prior_plan]
outputs:
  primary: a097_result
  required_fields: [allocation_plan, headroom, bottlenecks, risks, recommendations, status, confidence, assumptions, derived_from, warnings, errors, next_action]
tools:
  allowed: [tool.ollama.generate]
skills: [SK004, SK040]
prompts: [PR001]
knowledge: [KP004]
policy:
  side_effects: false
  external_actions: prohibited
provenance:
  source: Phase-12 Control Contract
  source_type: internal
runtime:
  adapter: backend.app.runtime.a097
  entrypoint: run_a097_resource_planning
