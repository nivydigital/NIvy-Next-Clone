id: A097
name: Resource Planning Analyst
version: "1.0"
status: implementation
category: control
purpose: Map plans to resource needs and constraints; flag gaps and reallocation options.
inputs:
  required: [operational_plan]
  optional: [resource_inventory, capacity_constraints, planning_constraints]
outputs:
  primary: resource_plan
  required_fields: [allocations, gaps, reallocation_options, confidence, assumptions, derived_from]
  downstream_events: [resource_plan.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, allocate, identify_gaps, propose_reallocations, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - allocations_and_gaps_are_explicit
  - options_are_actionable
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A097 Resource Planning Analyst)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
