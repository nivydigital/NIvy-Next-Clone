id: A035
name: Contact Discovery
version: "1.0"
status: implementation
category: lead_ops
purpose: Discover relevant contacts within target accounts based on persona and buying-committee guidance.
inputs:
  required: [discovered_leads, buyer_personas]
  optional: [icp_definition, contact_constraints]
outputs:
  primary: discovered_contacts
  required_fields: [contacts, role_match, sources, confidence, assumptions, derived_from]
  downstream_events: [contact_discovery.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, map_personas, discover_contacts, score_role_match, attach_sources, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - contacts_align_with_personas
  - sources_and_role_match_are_explicit
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A035 Contact Discovery)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
