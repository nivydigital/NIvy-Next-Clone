id: A098
name: Evaluation Analyst
version: "1.0"
status: implementation
category: evaluation
purpose: Evaluate agent or workflow outputs against quality rubrics and success criteria.
inputs:
  required: [evaluation_target]
  optional: [rubric, baseline, evaluation_constraints]
outputs:
  primary: evaluation_report
  required_fields: [scores, findings, pass_fail, recommendations, confidence, assumptions, derived_from]
  downstream_events: [evaluation_report.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, apply_rubric, score, list_findings, recommend, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - scores_and_findings_are_traceable
  - recommendations_are_actionable
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A098 Evaluation Analyst)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
