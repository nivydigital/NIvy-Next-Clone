id: A095
name: Risk Analyst
version: "1.0"
status: implementation
category: control
purpose: Assess operational and strategic risks from anomalies, KPIs and context; recommend mitigations.
inputs:
  required: [risk_signals]
  optional: [anomaly_report, kpi_intelligence, risk_constraints]
outputs:
  primary: risk_assessment
  required_fields: [risks, severity, mitigations, residual_risk, confidence, assumptions, derived_from]
  downstream_events: [risk_assessment.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, identify_risks, score_severity, recommend_mitigations, assess_residual, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - risks_and_severity_are_explicit
  - mitigations_are_actionable
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A095 Risk Analyst)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
