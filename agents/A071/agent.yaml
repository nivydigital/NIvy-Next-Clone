id: A071
name: Communication Quality Reviewer
version: "1.0"
status: implementation
category: communications
purpose: Review drafted communications for quality, compliance, tone and policy fit before send.
inputs:
  required: [response_draft]
  optional: [messaging_positioning, quality_rules, review_constraints]
outputs:
  primary: quality_review
  required_fields: [pass_fail, issues, suggested_edits, score, confidence, assumptions, derived_from]
  downstream_events: [quality_review.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, apply_rules, list_issues, suggest_edits, score, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - pass_fail_and_issues_are_explicit
  - suggested_edits_are_actionable
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A071 Communication Quality Reviewer)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
