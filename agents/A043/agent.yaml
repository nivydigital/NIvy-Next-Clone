id: A043
name: Outreach Strategy
version: "1.0"
status: implementation
category: outreach_ops
purpose: Design per-lead or segment outreach channel mix, sequence outline and messaging angles from research and strategy inputs.
inputs:
  required: [account_research, outreach_strategy]
  optional: [messaging_positioning, scored_leads, outreach_constraints]
outputs:
  primary: outreach_plan
  required_fields: [channel_mix, sequence_outline, messaging_angles, success_metrics, confidence, assumptions, derived_from]
  downstream_events: [outreach_strategy.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, select_channels, outline_sequence, set_messaging_angles, define_metrics, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - plan_aligns_with_research_and_strategy
  - sequence_and_angles_are_actionable
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A043 Outreach Strategy)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy. Note: A014 is strategy-layer; A043 is operational outreach plan."
