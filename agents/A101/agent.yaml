id: A101
name: Runtime Quality Monitor
version: "1.0"
status: implementation
category: evaluation
purpose: Monitor live or batch runtime quality signals — latency, error rates, confidence, policy hits — and recommend non-mutating actions.
inputs:
  required: [telemetry_snapshot, quality_targets]
  optional: [error_budget, incident_history, prior_monitor_report, service_map]
outputs:
  primary: a101_result
  required_fields: [quality_status, signal_summary, anomalies, escalations, recommendations, status, confidence, assumptions, derived_from, warnings, errors, next_action]
tools:
  allowed: [tool.ollama.generate]
skills: [SK019, SK037]
prompts: [PR005]
knowledge: [KP004]
policy:
  side_effects: false
  external_actions: prohibited
provenance:
  source: Phase-13 Evaluation Contract
  source_type: internal
runtime:
  adapter: backend.app.runtime.a101
  entrypoint: run_a101_runtime_quality
