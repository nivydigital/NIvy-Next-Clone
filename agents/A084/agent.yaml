id: A084
name: Marketing Strategist
version: "1.0"
status: implementation
category: marketing
purpose: Synthesize go-to-market and demand strategy from market research, ICP and growth goals.
inputs:
  required: [market_research, icp_definition]
  optional: [growth_goals, competitive_context, strategy_constraints]
outputs:
  primary: marketing_strategy
  required_fields: [pillars, channel_priorities, messaging_themes, success_metrics, confidence, assumptions, derived_from]
  downstream_events: [marketing_strategy.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, define_pillars, prioritize_channels, set_messaging_themes, define_metrics, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - strategy_aligns_with_research_and_icp
  - metrics_are_explicit
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A084 Marketing Strategist)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
