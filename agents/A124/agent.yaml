id: A124
name: Tenant Isolation Auditor
version: "1.0"
status: implementation
category: scale_operations
purpose: Audit tenant isolation across AIOS data stores, runtimes and agent memory — detect cross-tenant leakage risks, policy gaps and isolation control effectiveness — without writing to any tenant system of record.
inputs:
  required: [tenant_map, isolation_controls]
  optional: [access_logs_summary, shared_resource_map, policy_matrix, prior_isolation_audit, known_incidents]
outputs:
  primary: a124_result
  required_fields: [isolation_posture, leakage_risks, control_gaps, policy_findings, recommendations, status, confidence, assumptions, derived_from, warnings, errors, next_action]
tools:
  allowed: [tool.ollama.generate]
skills: [SK037, SK038]
prompts: [PR005]
knowledge: [KP004]
policy:
  side_effects: false
  external_actions: prohibited
provenance:
  source: Phase-17 Scale Contract
  source_type: internal
  modifications: "Implemented under deferred-testing policy."
runtime:
  adapter: backend.app.runtime.a124
  entrypoint: run_a124_tenant_isolation_auditor
