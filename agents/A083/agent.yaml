id: A083
name: Revenue Analytics
version: "1.0"
status: implementation
category: finance
purpose: Analyze revenue trends, cohorts and drivers; surface insights for planning.
inputs:
  required: [revenue_records]
  optional: [cohort_definitions, analysis_constraints]
outputs:
  primary: revenue_insights
  required_fields: [trend_summary, cohort_insights, drivers, recommendations, confidence, assumptions, derived_from]
  downstream_events: [revenue_insights.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, summarize_trends, analyze_cohorts, identify_drivers, recommend, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - insights_are_evidence_backed
  - recommendations_are_actionable
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A083 Revenue Analytics)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
