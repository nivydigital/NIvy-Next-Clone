id: A090
name: Growth Experiment Planner
version: "1.0"
status: implementation
category: marketing
purpose: Design growth experiments from marketing insights and strategy with hypotheses, metrics and run plans.
inputs:
  required: [marketing_insights]
  optional: [marketing_strategy, experiment_constraints]
outputs:
  primary: experiment_plan
  required_fields: [hypotheses, variants, success_metrics, run_plan, confidence, assumptions, derived_from]
  downstream_events: [experiment_plan.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, form_hypotheses, define_variants, set_metrics, outline_run_plan, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - hypotheses_are_testable
  - metrics_and_run_plan_are_actionable
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A090 Growth Experiment Planner)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
