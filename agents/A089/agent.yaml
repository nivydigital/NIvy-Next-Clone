id: A089
name: Marketing Analytics
version: "1.0"
status: implementation
category: marketing
purpose: Aggregate marketing performance across channels and surface insights for strategy and experiments.
inputs:
  required: [marketing_performance]
  optional: [marketing_strategy, attribution_notes, analysis_constraints]
outputs:
  primary: marketing_insights
  required_fields: [channel_summary, top_insights, recommended_experiments, confidence, assumptions, derived_from]
  downstream_events: [marketing_insights.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, summarize_channels, extract_insights, recommend_experiments, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - insights_are_evidence_backed
  - experiments_are_actionable
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A089 Marketing Analytics)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
