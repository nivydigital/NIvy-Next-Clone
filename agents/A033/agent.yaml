id: A033
name: Strategic Planning Agent
version: "1.0"
status: implementation
category: growth_strategy
purpose: Synthesize prior strategy artifacts into annual/quarterly strategic priorities, initiatives, resource guidance and success metrics.
inputs:
  required: [gtm_strategy, revenue_operations_strategy]
  optional: [experiment_growth_plan, continuous_improvement_strategy, brand_strategy, planning_constraints]
outputs:
  primary: strategic_plan
  required_fields: [priorities, initiatives, resource_guidance, success_metrics, risk_register, confidence, assumptions, derived_from]
  downstream_events: [strategic_plan.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, set_priorities, define_initiatives, set_resource_guidance, define_metrics, build_risk_register, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - plan_is_internally_consistent_with_prior_strategy
  - priorities_and_metrics_are_actionable
  - assumptions_and_risks_are_explicit
provenance:
  source: sequential strategy chain after A032
  source_type: internal
  modifications: "Created under deferred-testing policy."
