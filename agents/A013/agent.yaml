id: A013
name: Lead Generation Strategy Agent
version: "1.0"
status: implementation
category: revenue_strategy
purpose: Design evidence-backed lead generation strategy covering sources, targeting rules, volume goals and qualification handoff from ICP, GTM and campaign strategy.
inputs:
  required: [icp_definition, gtm_strategy]
  optional: [campaign_strategy, channel_strategy, buyer_personas, historical_performance, lead_constraints]
outputs:
  primary: lead_generation_strategy
  required_fields: [sources, targeting_rules, volume_goals, qualification_handoff, prioritization, confidence, assumptions, derived_from]
  downstream_events: [lead_generation_strategy.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, define_sources, set_targeting, set_volume_goals, define_handoff, prioritize, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - sources_and_targeting_align_with_ICP_and_GTM
  - volume_goals_and_handoff_are_actionable
  - assumptions_are_explicit
provenance:
  source: sequential strategy chain after A012
  source_type: internal
  modifications: "Created under deferred-testing policy."
