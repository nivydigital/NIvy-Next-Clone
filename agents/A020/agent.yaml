id: A020
name: Customer Health Strategy Agent
version: "1.0"
status: implementation
category: customer_success
purpose: Define customer health model, leading indicators, scoring rules and intervention triggers from retention and onboarding strategy.
inputs:
  required: [retention_expansion_strategy, onboarding_strategy]
  optional: [icp_definition, historical_health, health_constraints]
outputs:
  primary: customer_health_strategy
  required_fields: [health_dimensions, leading_indicators, scoring_rules, intervention_triggers, reporting_cadence, confidence, assumptions, derived_from]
  downstream_events: [customer_health_strategy.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, define_dimensions, set_indicators, build_scoring, set_interventions, define_reporting, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - health_model_aligns_with_retention_strategy
  - indicators_and_triggers_are_actionable
  - assumptions_are_explicit
provenance:
  source: sequential strategy chain after A019
  source_type: internal
  modifications: "Created under deferred-testing policy."
