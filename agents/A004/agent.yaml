id: A004
name: Competitor Intelligence Agent
version: "1.0"
status: implementation
category: market_intelligence
purpose: Build evidence-backed competitor intelligence covering competitors, offers, positioning, gaps and observable market signals.
inputs:
  required: [market_research]
  optional: [icp_definition, business_offer, competitor_set, geography]
outputs:
  primary: competitor_intelligence
  required_fields: [competitors, comparison, positioning, gaps, evidence, confidence, assumptions, derived_from]
  downstream_events: [competitor_intelligence.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, identify_competitors, compare_offers, analyze_positioning, identify_gaps, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_competitor_evidence: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - competitor_claims_are_source_traceable
  - observed_facts_are_separated_from_analysis
  - material_unknowns_are_explicit
provenance:
  source: Raw-Repository/Chats/ChatGPT/Multi Agent AIOS/02-agents/registry.yaml
  source_type: internal
