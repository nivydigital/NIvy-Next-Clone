id: A036
name: Lead Enrichment
version: "1.0"
status: implementation
category: lead_ops
purpose: Enrich discovered leads and contacts with firmographic, technographic and contextual attributes from public sources.
inputs:
  required: [discovered_leads]
  optional: [discovered_contacts, enrichment_fields, enrichment_constraints]
outputs:
  primary: enriched_leads
  required_fields: [enriched_records, fields_added, sources, confidence, assumptions, derived_from]
  downstream_events: [lead_enrichment.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, select_fields, enrich_records, attach_sources, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - enrichment_is_source_backed
  - fields_added_are_explicit
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A036 Lead Enrichment)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
