id: A080
name: Accounts Payable Analyst
version: "1.0"
status: implementation
category: finance
purpose: Analyze AP obligations, due dates and recommend payment prioritization.
inputs:
  required: [ap_records]
  optional: [cash_position, payment_policy, analysis_constraints]
outputs:
  primary: ap_analysis
  required_fields: [due_summary, payment_priorities, risk_flags, confidence, assumptions, derived_from]
  downstream_events: [ap_analysis.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, summarize_dues, prioritize_payments, flag_risks, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - priorities_are_justified
  - risk_flags_are_explicit
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A080 Accounts Payable Analyst)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
