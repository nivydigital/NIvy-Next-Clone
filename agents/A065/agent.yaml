id: A065
name: Onboarding Agent
version: "1.0"
status: implementation
category: customer_success
purpose: Plan and draft customer onboarding steps from onboarding strategy and deal context. Side-effect capable but default is plan/draft only.
inputs:
  required: [onboarding_strategy, qualification_result]
  optional: [proposal_draft, account_research, onboarding_constraints]
outputs:
  primary: onboarding_plan
  required_fields: [steps, milestones, owners, success_criteria, confidence, assumptions, derived_from]
  downstream_events: [onboarding.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny. External actions require approval.
workflow:
  sequence: [validate_input, validate_provenance, define_steps, set_milestones, assign_owners, define_success, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited_by_default
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - plan_aligns_with_onboarding_strategy
  - steps_and_milestones_are_actionable
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A065 Onboarding Agent)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy. No suitable open-source drop-in found."
