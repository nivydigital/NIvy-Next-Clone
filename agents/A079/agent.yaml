id: A079
name: Accounts Receivable Analyst
version: "1.0"
status: implementation
category: finance
purpose: Analyze AR aging and recommend collection priorities and outreach.
inputs:
  required: [ar_aging]
  optional: [customer_health, collection_policy, analysis_constraints]
outputs:
  primary: ar_analysis
  required_fields: [priority_accounts, aging_summary, collection_actions, confidence, assumptions, derived_from]
  downstream_events: [ar_analysis.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, summarize_aging, prioritize_accounts, recommend_actions, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - priorities_are_justified
  - collection_actions_are_actionable
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A079 Accounts Receivable Analyst)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
