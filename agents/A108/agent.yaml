id: A108
name: Regression Guard
version: "1.0"
status: implementation
category: learning
purpose: Detect regressions after agent, prompt or skill changes by comparing evaluation signals against baselines — report findings without rolling back production.
inputs:
  required: [change_summary, evaluation_snapshot]
  optional: [baseline_metrics, regression_thresholds, prior_guard_report, affected_agents]
outputs:
  primary: a108_result
  required_fields: [regression_status, affected_areas, severity, evidence, recommendations, status, confidence, assumptions, derived_from, warnings, errors, next_action]
tools:
  allowed: [tool.ollama.generate]
skills: [SK037, SK038]
prompts: [PR005]
knowledge: [KP004]
policy:
  side_effects: false
  external_actions: prohibited
provenance:
  source: Phase-14 Learning Contract
  source_type: internal
runtime:
  adapter: backend.app.runtime.a108
  entrypoint: run_a108_regression_guard
