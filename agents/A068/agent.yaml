id: A068
name: Response Drafting
version: "1.0"
status: implementation
category: communications
purpose: Draft outbound responses from triage result, conversation insights and messaging guidance.
inputs:
  required: [inbound_triage, messaging_positioning]
  optional: [conversation_insights, account_context, response_constraints]
outputs:
  primary: response_draft
  required_fields: [draft, tone, compliance_checks, confidence, assumptions, derived_from]
  downstream_events: [response_drafting.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, draft_response, set_tone, run_compliance, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - draft_addresses_inbound_intent
  - compliance_checks_are_explicit
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A068 Response Drafting)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
