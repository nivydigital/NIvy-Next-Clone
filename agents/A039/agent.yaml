id: A039
name: Lead Scoring
version: "1.0"
status: implementation
category: lead_ops
purpose: Score leads on ICP fit, intent, reachability and data quality using qualification strategy and verified records.
inputs:
  required: [verified_records, qualification_scoring_strategy]
  optional: [icp_definition, data_quality_report, scoring_constraints]
outputs:
  primary: scored_leads
  required_fields: [scores, score_breakdown, priority_order, confidence, assumptions, derived_from]
  downstream_events: [lead_scoring.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, apply_scoring_model, rank_leads, attach_breakdown, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - scores_traceable_to_qualification_strategy
  - breakdown_and_priority_are_explicit
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A039 Lead Scoring)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
