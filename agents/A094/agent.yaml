id: A094
name: Anomaly Detection Analyst
version: "1.0"
status: implementation
category: control
purpose: Detect anomalies in operational and financial metrics and recommend investigation paths.
inputs:
  required: [metric_series]
  optional: [baselines, detection_rules, analysis_constraints]
outputs:
  primary: anomaly_report
  required_fields: [anomalies, severity, investigation_paths, confidence, assumptions, derived_from]
  downstream_events: [anomaly_report.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, detect_anomalies, score_severity, recommend_investigation, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - anomalies_are_evidence_backed
  - investigation_paths_are_actionable
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A094 Anomaly Detection Analyst)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
