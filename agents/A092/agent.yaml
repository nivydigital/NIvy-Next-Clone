id: A092
name: KPI Intelligence Analyst
version: "1.0"
status: implementation
category: control
purpose: Interpret KPI packs against targets; surface variance, drivers and recommended actions.
inputs:
  required: [kpi_pack]
  optional: [targets, prior_period, analysis_constraints]
outputs:
  primary: kpi_intelligence
  required_fields: [variance_summary, drivers, recommended_actions, confidence, assumptions, derived_from]
  downstream_events: [kpi_intelligence.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, compute_variance, identify_drivers, recommend_actions, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - variance_is_explained
  - actions_are_actionable
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A092 KPI Intelligence Analyst)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
