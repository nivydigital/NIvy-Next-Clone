id: A091
name: Campaign QA Reviewer
version: "1.0"
status: implementation
category: marketing
purpose: QA campaign assets and plans for brand, compliance and strategic fit before launch.
inputs:
  required: [campaign_package]
  optional: [marketing_strategy, qa_rules, review_constraints]
outputs:
  primary: campaign_qa
  required_fields: [pass_fail, issues, suggested_fixes, score, confidence, assumptions, derived_from]
  downstream_events: [campaign_qa.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, apply_qa_rules, list_issues, suggest_fixes, score, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - pass_fail_and_issues_are_explicit
  - suggested_fixes_are_actionable
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A091 Campaign QA Reviewer)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
