id: A050
name: Follow-Up
version: "1.0"
status: implementation
category: outreach_ops
purpose: Detect stale opportunities and draft context-aware follow-up messages under policy gates. Side-effect capable (send) but default is draft-only.
inputs:
  required: [email_drafts, account_research]
  optional: [outreach_plan, conversation_context, follow_up_constraints]
outputs:
  primary: follow_up_drafts
  required_fields: [drafts, trigger_reason, timing_guidance, compliance_checks, confidence, assumptions, derived_from]
  downstream_events: [follow_up.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny. External send requires explicit approval.
workflow:
  sequence: [validate_input, validate_provenance, detect_stale, draft_follow_ups, apply_timing, run_compliance, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited_by_default
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - drafts_are_context_aware
  - timing_and_compliance_are_explicit
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A050 Follow-Up)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
