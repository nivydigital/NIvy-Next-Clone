id: A019
name: Retention & Expansion Strategy Agent
version: "1.0"
status: implementation
category: customer_success
purpose: Define retention plays, expansion triggers, risk signals and success metrics from onboarding, offer and ICP strategy.
inputs:
  required: [onboarding_strategy, offer_pricing_strategy]
  optional: [icp_definition, gtm_strategy, historical_retention, retention_constraints]
outputs:
  primary: retention_expansion_strategy
  required_fields: [retention_plays, expansion_triggers, risk_signals, success_metrics, playbook_outline, confidence, assumptions, derived_from]
  downstream_events: [retention_expansion_strategy.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, define_retention_plays, set_expansion_triggers, identify_risks, define_metrics, outline_playbooks, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - retention_and_expansion_plays_align_with_offer_and_onboarding
  - risk_signals_and_metrics_are_actionable
  - assumptions_are_explicit
provenance:
  source: sequential strategy chain after A018
  source_type: internal
  modifications: "Created under deferred-testing policy."
