id: A088
name: Paid Media Analyst
version: "1.0"
status: implementation
category: marketing
purpose: Analyze paid media performance and recommend budget and creative optimizations.
inputs:
  required: [paid_media_performance]
  optional: [marketing_strategy, budget_constraints, analysis_constraints]
outputs:
  primary: paid_media_analysis
  required_fields: [performance_summary, budget_recommendations, creative_recommendations, confidence, assumptions, derived_from]
  downstream_events: [paid_media_analysis.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, summarize_performance, recommend_budget, recommend_creative, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - recommendations_are_evidence_backed
  - budget_and_creative_are_actionable
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A088 Paid Media Analyst)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
