id: A078
name: Billing Analyst
version: "1.0"
status: implementation
category: finance
purpose: Analyze billing data for anomalies, disputes and process recommendations.
inputs:
  required: [billing_records]
  optional: [customer_context, billing_rules, analysis_constraints]
outputs:
  primary: billing_analysis
  required_fields: [anomalies, dispute_candidates, process_recommendations, confidence, assumptions, derived_from]
  downstream_events: [billing_analysis.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, detect_anomalies, flag_disputes, recommend_process, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - anomalies_are_evidence_backed
  - recommendations_are_actionable
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A078 Billing Analyst)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
