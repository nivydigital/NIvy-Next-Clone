id: A012
name: Experiment & Growth Planning Agent
version: "1.0"
status: implementation
category: growth_strategy
purpose: Design prioritized growth experiments and learning agenda from GTM, campaign and channel strategy with clear hypotheses, metrics and decision rules.
inputs:
  required: [gtm_strategy, campaign_strategy]
  optional: [channel_strategy, content_strategy, offer_pricing_strategy, historical_performance, experiment_constraints]
outputs:
  primary: experiment_growth_plan
  required_fields: [experiments, hypotheses, metrics, prioritization, decision_rules, learning_agenda, confidence, assumptions, derived_from]
  downstream_events: [experiment_growth_plan.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, generate_hypotheses, design_experiments, define_metrics, prioritize, set_decision_rules, build_learning_agenda, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - experiments_have_clear_hypotheses_and_metrics
  - prioritization_and_decision_rules_are_explicit
  - learning_agenda_is_actionable
provenance:
  source: sequential strategy chain after A011
  source_type: internal
  modifications: "Created under deferred-testing policy."
