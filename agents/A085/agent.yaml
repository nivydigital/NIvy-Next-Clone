id: A085
name: Content Strategist
version: "1.0"
status: implementation
category: marketing
purpose: Plan content pillars, formats and calendar from marketing strategy and messaging themes.
inputs:
  required: [marketing_strategy]
  optional: [messaging_positioning, audience_insights, content_constraints]
outputs:
  primary: content_strategy
  required_fields: [pillars, formats, calendar_outline, success_metrics, confidence, assumptions, derived_from]
  downstream_events: [content_strategy.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, define_pillars, select_formats, outline_calendar, define_metrics, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - strategy_aligns_with_marketing_strategy
  - calendar_and_metrics_are_actionable
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A085 Content Strategist)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
