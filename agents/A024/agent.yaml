id: A024
name: Analytics & Reporting Strategy Agent
version: "1.0"
status: implementation
category: revenue_ops
purpose: Define analytics model, report hierarchy, data ownership and decision cadence from RevOps and GTM strategy.
inputs:
  required: [revenue_operations_strategy, gtm_strategy]
  optional: [pipeline_deal_strategy, campaign_strategy, analytics_constraints]
outputs:
  primary: analytics_reporting_strategy
  required_fields: [report_hierarchy, kpi_definitions, data_ownership, decision_cadence, dashboard_outline, confidence, assumptions, derived_from]
  downstream_events: [analytics_reporting_strategy.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, define_hierarchy, define_kpis, assign_ownership, set_cadence, outline_dashboards, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - reports_and_KPIs_align_with_RevOps_and_GTM
  - ownership_and_cadence_are_explicit
  - assumptions_are_stated
provenance:
  source: sequential strategy chain after A023
  source_type: internal
  modifications: "Created under deferred-testing policy."
