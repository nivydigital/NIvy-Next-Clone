id: A104
name: Feedback Analyst
version: "1.0"
status: implementation
category: learning
purpose: Analyze user and system feedback on agent outputs — themes, severity, actionable improvement signals — without applying live changes.
inputs:
  required: [feedback_corpus, analysis_scope]
  optional: [agent_filter, prior_themes, severity_rubric, product_context]
outputs:
  primary: a104_result
  required_fields: [theme_summary, severity_distribution, actionable_signals, risks, recommendations, status, confidence, assumptions, derived_from, warnings, errors, next_action]
tools:
  allowed: [tool.ollama.generate]
skills: [SK037, SK039]
prompts: [PR005]
knowledge: [KP004]
policy:
  side_effects: false
  external_actions: prohibited
provenance:
  source: Phase-14 Learning Contract
  source_type: internal
runtime:
  adapter: backend.app.runtime.a104
  entrypoint: run_a104_feedback_analyst
