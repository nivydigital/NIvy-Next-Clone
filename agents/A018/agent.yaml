id: A018
name: Customer Onboarding Strategy Agent
version: "1.0"
status: implementation
category: customer_success
purpose: Define onboarding journey, milestones, success criteria and handoff rules from offer, GTM and sales enablement strategy.
inputs:
  required: [offer_pricing_strategy, gtm_strategy]
  optional: [sales_enablement_strategy, messaging_positioning, icp_definition, onboarding_constraints]
outputs:
  primary: onboarding_strategy
  required_fields: [journey_stages, milestones, success_criteria, handoff_rules, risk_signals, confidence, assumptions, derived_from]
  downstream_events: [onboarding_strategy.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, define_journey, set_milestones, define_success_criteria, set_handoffs, identify_risks, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - journey_and_milestones_align_with_offer_and_GTM
  - success_criteria_and_handoffs_are_actionable
  - assumptions_are_explicit
provenance:
  source: sequential strategy chain after A017
  source_type: internal
  modifications: "Created under deferred-testing policy."
