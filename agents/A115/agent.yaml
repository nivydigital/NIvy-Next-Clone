id: A115
name: Collaboration Auditor
version: "1.0"
status: implementation
category: collaboration
purpose: Audit multi-agent collaboration runs for policy compliance, context leakage risk and quality of handoffs — produce findings without mutating collaboration state.
inputs:
  required: [collaboration_trace, policy_baseline]
  optional: [context_snapshots, known_exceptions, prior_audit, quality_targets]
outputs:
  primary: a115_result
  required_fields: [audit_summary, policy_findings, leakage_risks, handoff_quality, recommendations, status, confidence, assumptions, derived_from, warnings, errors, next_action]
tools:
  allowed: [tool.ollama.generate]
skills: [SK037, SK038]
prompts: [PR005]
knowledge: [KP004]
policy:
  side_effects: false
  external_actions: prohibited
provenance:
  source: Phase-15 Collaboration Contract
  source_type: internal
  modifications: "Implemented under deferred-testing policy; pushed to GitHub."
runtime:
  adapter: backend.app.runtime.a115
  entrypoint: run_a115_collaboration_auditor
