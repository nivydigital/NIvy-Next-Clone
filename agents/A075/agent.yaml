id: A075
name: Customer Success Planner
version: "1.0"
status: implementation
category: customer_success
purpose: Plan CS motions (QBRs, adoption, expansion) from health assessment and account context.
inputs:
  required: [health_assessment]
  optional: [onboarding_schedule, account_context, planning_constraints]
outputs:
  primary: cs_plan
  required_fields: [motions, timeline, owners, success_metrics, confidence, assumptions, derived_from]
  downstream_events: [cs_plan.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, define_motions, set_timeline, assign_owners, define_metrics, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - motions_are_actionable
  - metrics_and_owners_are_explicit
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A075 Customer Success Planner)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
