id: A049
name: Personalization
version: "1.0"
status: implementation
category: outreach_ops
purpose: Generate personalization hooks and context from account research and messaging for use in outreach drafts.
inputs:
  required: [account_research, messaging_positioning]
  optional: [scored_leads, personalization_constraints]
outputs:
  primary: personalization_pack
  required_fields: [hooks, context_snippets, do_not_use, confidence, assumptions, derived_from]
  downstream_events: [personalization.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, extract_hooks, draft_snippets, define_do_not_use, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - hooks_are_evidence_backed
  - do_not_use_boundaries_are_explicit
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A049 Personalization)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
