id: A052
name: Reply Triage
version: "1.0"
status: implementation
category: outreach_ops
purpose: Classify inbound replies (interested, not now, unsubscribe, question, out-of-office, etc.) and recommend next action.
inputs:
  required: [inbound_message]
  optional: [conversation_context, triage_rules, triage_constraints]
outputs:
  primary: triage_result
  required_fields: [classification, recommended_action, urgency, confidence, assumptions, derived_from]
  downstream_events: [reply_triage.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, classify_reply, recommend_action, set_urgency, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - classification_is_explicit
  - recommended_action_is_actionable
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A052 Reply Triage)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
