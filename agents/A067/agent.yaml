id: A067
name: Conversation Intelligence
version: "1.0"
status: implementation
category: communications
purpose: Extract insights, objections, commitments and sentiment from conversation transcripts or threads.
inputs:
  required: [conversation_transcript]
  optional: [account_context, analysis_focus, analysis_constraints]
outputs:
  primary: conversation_insights
  required_fields: [summary, objections, commitments, sentiment, next_best_actions, confidence, assumptions, derived_from]
  downstream_events: [conversation_intelligence.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, summarize, extract_objections, extract_commitments, score_sentiment, recommend_actions, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - insights_are_traceable_to_transcript
  - actions_are_actionable
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A067 Conversation Intelligence)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
