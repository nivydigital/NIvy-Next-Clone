id: A116
name: Agent Package Builder
version: "1.0"
status: implementation
category: agent_factory
purpose: Assemble certified agent packages — manifests, dependency locks, skill bindings and install readiness — without publishing or installing packages to production registries.
inputs:
  required: [agent_spec, certification_verdict]
  optional: [dependency_map, skill_bindings, schema_versions, prior_package, packaging_constraints]
outputs:
  primary: a116_result
  required_fields: [package_manifest, dependency_lock, skill_bindings, install_readiness, gaps, status, confidence, assumptions, derived_from, warnings, errors, next_action]
tools:
  allowed: [tool.ollama.generate]
skills: [SK006, SK037]
prompts: [PR005]
knowledge: [KP004]
policy:
  side_effects: false
  external_actions: prohibited
provenance:
  source: Phase-16 Factory Contract
  source_type: internal
  modifications: "Implemented under deferred-testing policy; pushed to GitHub."
runtime:
  adapter: backend.app.runtime.a116
  entrypoint: run_a116_agent_package_builder
