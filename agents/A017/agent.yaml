id: A017
name: Proposal Strategy Agent
version: "1.0"
status: implementation
category: revenue_strategy
purpose: Design proposal structure, value framing, pricing presentation and approval boundaries from offer strategy, messaging and deal context.
inputs:
  required: [offer_pricing_strategy, messaging_positioning]
  optional: [sales_enablement_strategy, pipeline_deal_strategy, competitor_intelligence, proposal_constraints]
outputs:
  primary: proposal_strategy
  required_fields: [structure, value_framing, pricing_presentation, proof_sections, approval_boundaries, confidence, assumptions, derived_from]
  downstream_events: [proposal_strategy.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, define_structure, frame_value, present_pricing, map_proof, set_approval_boundaries, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - proposal_structure_aligns_with_offer_and_messaging
  - approval_boundaries_are_explicit
  - assumptions_are_stated
provenance:
  source: sequential strategy chain after A016
  source_type: internal
  modifications: "Created under deferred-testing policy."
