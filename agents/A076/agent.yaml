id: A076
name: Renewal Risk Analyst
version: "1.0"
status: implementation
category: customer_success
purpose: Score renewal risk from health, support and commercial signals; recommend save plays.
inputs:
  required: [health_assessment]
  optional: [support_history, commercial_context, risk_constraints]
outputs:
  primary: renewal_risk
  required_fields: [risk_score, risk_drivers, save_plays, urgency, confidence, assumptions, derived_from]
  downstream_events: [renewal_risk.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, score_risk, list_drivers, recommend_saves, set_urgency, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - risk_score_is_justified
  - save_plays_are_actionable
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A076 Renewal Risk Analyst)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
