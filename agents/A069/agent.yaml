id: A069
name: Meeting Intelligence
version: "1.0"
status: implementation
category: communications
purpose: Analyze meeting notes or transcripts for decisions, action items, risks and follow-ups.
inputs:
  required: [meeting_notes]
  optional: [meeting_brief, account_context, analysis_constraints]
outputs:
  primary: meeting_intelligence
  required_fields: [decisions, action_items, risks, follow_ups, summary, confidence, assumptions, derived_from]
  downstream_events: [meeting_intelligence.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, extract_decisions, extract_actions, identify_risks, list_follow_ups, summarize, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - decisions_and_actions_are_explicit
  - follow_ups_are_actionable
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A069 Meeting Intelligence)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
