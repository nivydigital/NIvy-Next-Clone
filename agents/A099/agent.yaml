id: A099
name: Regression QA Agent
version: "1.0"
status: implementation
category: evaluation
purpose: Detect quality regressions across agent versions by comparing evaluation outcomes to baselines — report severity without auto-rollback.
inputs:
  required: [baseline_results, candidate_results]
  optional: [thresholds, affected_agents, prior_regression_report, change_context]
outputs:
  primary: a099_result
  required_fields: [regression_verdict, delta_summary, severity, evidence, recommendations, status, confidence, assumptions, derived_from, warnings, errors, next_action]
tools:
  allowed: [tool.ollama.generate]
skills: [SK037, SK038]
prompts: [PR005]
knowledge: [KP004]
policy:
  side_effects: false
  external_actions: prohibited
provenance:
  source: Phase-13 Evaluation Contract
  source_type: internal
runtime:
  adapter: backend.app.runtime.a099
  entrypoint: run_a099_regression_qa
