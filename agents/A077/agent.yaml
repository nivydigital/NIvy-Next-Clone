id: A077
name: Feedback & NPS Analyst
version: "1.0"
status: implementation
category: customer_success
purpose: Analyze NPS and qualitative feedback for themes, promoters/detractors and product/CS actions.
inputs:
  required: [feedback_corpus]
  optional: [nps_scores, account_context, analysis_constraints]
outputs:
  primary: feedback_analysis
  required_fields: [themes, nps_summary, promoter_actions, detractor_actions, confidence, assumptions, derived_from]
  downstream_events: [feedback_analysis.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, extract_themes, summarize_nps, recommend_actions, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - themes_are_traceable_to_feedback
  - actions_are_actionable
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A077 Feedback & NPS Analyst)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
