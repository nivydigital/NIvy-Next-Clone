id: A055
name: Meeting Prep
version: "1.0"
status: implementation
category: sales_ops
purpose: Prepare meeting briefs from account research, qualification and conversation context for sales calls.
inputs:
  required: [account_research, qualification_result]
  optional: [conversation_context, messaging_positioning, meeting_constraints]
outputs:
  primary: meeting_brief
  required_fields: [agenda, talking_points, risks, questions, confidence, assumptions, derived_from]
  downstream_events: [meeting_prep.completed]
tools:
  allowed: [tool.ollama.generate]
  authorization_rule: Agent -> Skill -> Tool -> Action; default deny.
workflow:
  sequence: [validate_input, validate_provenance, build_agenda, extract_talking_points, identify_risks, draft_questions, score_confidence, audit]
policy:
  public_data_only: true
  source_provenance_required: true
  fabricated_claims: forbidden
  sensitive_attribute_inference: forbidden
  external_actions: prohibited
quality:
  evidence_backed: true
  uncertainty_explicit: true
  claims_traceable: true
observability:
  audit_required: true
  execution_log_required: true
failure_handling:
  retry_transient_errors: true
  max_retries: 3
  fail_closed_on_policy_or_schema_error: true
success_criteria:
  - brief_is_actionable_for_sales
  - risks_and_questions_are_explicit
  - assumptions_are_stated
provenance:
  source: agents/registry.yaml (A055 Meeting Prep)
  source_type: internal
  modifications: "Promoted from declared/planned to implementation under deferred-testing policy."
