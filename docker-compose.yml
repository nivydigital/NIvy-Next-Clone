services:
  backend:
    build: ./backend
    container_name: nivy-backend
    ports:
      - "${NIVY_API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nivy}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-nivy}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      N8N_URL: ${N8N_URL:-http://n8n:5678}
      N8N_EMAIL_WEBHOOK: ${N8N_EMAIL_WEBHOOK:-/webhook/nivy/send-email}
      FIRECRAWL_URL: ${FIRECRAWL_URL:-https://api.firecrawl.dev/v2}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      BROWSER_USE_URL: ${BROWSER_USE_URL:-https://api.browser-use.com/api/v3}
      BROWSER_USE_API_KEY: ${BROWSER_USE_API_KEY:-}
      ODOO_URL: ${ODOO_URL:-}
      ODOO_DB: ${ODOO_DB:-}
      ODOO_USER: ${ODOO_USER:-}
      ODOO_PASSWORD: ${ODOO_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: nivy-frontend
    ports:
      - "${NIVY_WEB_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: nivy-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nivy}
      POSTGRES_USER: ${POSTGRES_USER:-nivy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - ${NIVY_POSTGRES_DATA:-./.local-data/postgres}:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nivy} -d ${POSTGRES_DB:-nivy}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nivy-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: nivy-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ${NIVY_QDRANT_DATA:-./.local-data/qdrant}:/qdrant/storage
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: nivy-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ${NIVY_MINIO_DATA:-./.local-data/minio}:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: nivy-ollama
    ports:
      - "11434:11434"
    volumes:
      - ${NIVY_OLLAMA_DATA:-./.local-data/ollama}:/root/.ollama
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: nivy-n8n
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-nivy}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-nivy}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-to-a-long-random-value}
      N8N_SECURE_COOKIE: "false"
    volumes:
      - ${NIVY_N8N_DATA:-./.local-data/n8n}:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  reacher:
    image: reacherhq/backend:latest
    container_name: nivy-reacher
    ports:
      - "8080:8080"
    restart: unless-stopped
