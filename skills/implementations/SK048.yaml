id: SK048
name: SMS Outreach
version: "1.1"
status: implementation
category: sales
standard: STD-01/v2
objective: Draft compliant SMS outreach with length bounds, stop rules, and approval gate.
non_goals:
  - Messages over policy length
  - Auto-send
  - Inventing personalization
inputs:
  required:
    - {name: contact, type: object}
    - {name: context, type: object}
    - {name: offer, type: object}
  optional:
    - {name: constraints, type: object}
    - {name: prior_result, type: object}
outputs:
  required:
    - {name: message, type: string}
    - {name: stop_rules, type: array}
    - {name: approval_state, type: string}
  common: [status, confidence, assumptions, derived_from, warnings, errors, next_action]
procedure:
  - {step: 1, name: validate_inputs, action: validate_inputs, detail: "Require contact, context, offer. Fail closed if contact missing.", on_failure: fail_closed}
  - {step: 2, name: prepare_context, action: prepare_context, detail: "Load length limits and compliance constraints from policy/constraints.", on_failure: fail_closed}
  - {step: 3, name: execute_core, action: execute_core, detail: "Draft short SMS from verified context within length bound. Set stop_rules and approval_state=pending_approval.", on_failure: fail_closed}
  - {step: 4, name: quality_check, action: quality_check, detail: "message length bounded; approval_state set; stop_rules present.", on_failure: partial}
  - {step: 5, name: verify_outputs, action: verify_outputs, detail: "Confirm message, stop_rules, approval_state.", on_failure: fail_closed}
  - {step: 6, name: return_audit, action: return_audit, detail: "Return message, stop_rules, approval_state, status, next_action.", on_failure: fail_closed}
preconditions: ["contact, context, offer present"]
postconditions: ["message length bounded", "stop_rules present"]
quality_checks: [message_length_bounded, approval_state_set, schema_valid, policy_compliant]
failure_policy: fail_closed_on_missing_contact
evidence_policy: cite context fields used; never invent citations
dependencies:
  skills: [SK043, SK049]
  tools: [tool.ollama.generate]
  knowledge: []
  prompts: []
permissions:
  side_effects: false
  data_classes: [internal, pii]
acceptance_criteria:
  - {id: AC1, statement: "Returns message, stop_rules, approval_state", verify: schema}
  - {id: AC2, statement: "Rejects missing contact", verify: test}
  - {id: AC3, statement: "Message respects length bound", verify: test}
evaluation:
  unit_cases: [happy_path, missing_contact, overlength_rejected]
  regression_required: true
provenance:
  source: skills/definitions.yaml + STD-01/v2 + A2 deepen
  last_reviewed: "2026-09-17"
  owner: unassigned
