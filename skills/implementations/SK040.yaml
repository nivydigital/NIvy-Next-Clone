id: SK040
name: Lead Segmentation
version: "1.1"
status: implementation
category: sales
standard: STD-01/v2
objective: Assign leads to deterministic useful segments using only configured segment_rules.
non_goals:
  - Inventing segments not defined in segment_rules
  - Soft matching outside rule definitions
  - External side effects unless agent policy authorizes a listed tool
inputs:
  required:
    - {name: lead, type: object, constraints: "lead with attributes for rule matching"}
    - {name: segment_rules, type: object, constraints: "named segments with match conditions"}
  optional:
    - {name: constraints, type: object}
    - {name: prior_result, type: object}
    - {name: context, type: object}
outputs:
  required:
    - {name: segment, type: string}
    - {name: rationale, type: object}
  common: [status, confidence, assumptions, derived_from, warnings, errors, next_action]
procedure:
  - {step: 1, name: validate_inputs, action: validate_inputs, detail: "Require lead and segment_rules. Fail closed if rules missing or empty.", on_failure: fail_closed}
  - {step: 2, name: prepare_context, action: prepare_context, detail: "Load segment definitions and match conditions; order by priority if specified.", on_failure: fail_closed}
  - {step: 3, name: execute_core, action: execute_core, detail: "Match lead attributes against segment_rules in priority order. Assign first matching segment. Document matched rule ids and attribute paths in rationale. If none match, assign default/unsegmented if defined else leave segment=unmatched.", on_failure: fail_closed}
  - {step: 4, name: quality_check, action: quality_check, detail: "Segment must come from rules only; rationale cites matched rules.", on_failure: partial}
  - {step: 5, name: verify_outputs, action: verify_outputs, detail: "Confirm segment and rationale present.", on_failure: fail_closed}
  - {step: 6, name: return_audit, action: return_audit, detail: "Return segment, rationale, status, confidence, next_action.", on_failure: fail_closed}
preconditions:
  - lead and segment_rules present
postconditions:
  - segment derived from rules only
  - rationale cites matched rules
quality_checks:
  - segment_from_rules_only
  - schema_valid
  - policy_compliant
failure_policy: fail_closed on missing rules; unmatched segment allowed when documented
evidence_policy: rationale cites matched rules; never invent citations
dependencies:
  skills: [SK039]
  tools: [tool.ollama.generate]
  knowledge: []
  prompts: []
permissions:
  side_effects: false
  data_classes: [internal]
acceptance_criteria:
  - {id: AC1, statement: "Returns segment and rationale", verify: schema}
  - {id: AC2, statement: "Rejects missing segment_rules", verify: test}
  - {id: AC3, statement: "Segment is from rules only", verify: test}
evaluation:
  unit_cases: [happy_path, missing_rules, no_match, multi_rule_priority]
  regression_required: true
provenance:
  source: skills/definitions.yaml + STD-01/v2 + A2 deepen
  last_reviewed: "2026-09-17"
  owner: unassigned
