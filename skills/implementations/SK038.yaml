id: SK038
name: Data Verification
version: "1.0"
status: implementation
objective: Verify material record claims against sources.
inputs: [records, sources]
outputs: [verification_results, evidence]
procedure:
  - step: 1
    action: extract_claims
  - step: 2
    action: match_sources
  - step: 3
    action: mark_verified_or_unverified
quality_checks: [no_verified_without_source, unresolved_listed]
failure_policy: fail_closed_on_missing_records
evidence_policy: claim-level source refs
dependencies: [SK037]
tools: [tool.ollama.generate]
acceptance: [verification_results is array]
