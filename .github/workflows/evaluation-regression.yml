name: evaluation-regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  phase9-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pyyaml httpx pydantic fastapi

      - name: Generate golden fixtures
        run: python scripts/generate_golden_fixtures.py

      - name: Run evaluation tests (offline)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest backend/app/test_evaluation.py backend/app/test_skills.py -q --tb=short

      - name: Workflow registry presence
        run: |
          test -f workflows/content-calendar/workflow.yaml
          test -f workflows/seo-audit/workflow.yaml
          test -f workflows/social-content-pipeline/workflow.yaml
          test -f workflows/inbound-email-triage/workflow.yaml
          test -f evaluation/chains.yaml
