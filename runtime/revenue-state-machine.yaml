version: "1.0"
status: canonical
name: revenue-lead-state-machine
states:
  - new
  - qualified
  - proposal
  - won
  - lost
transitions:
  - {from: new, event: qualify_pass, to: qualified}
  - {from: new, event: qualify_fail, to: new}
  - {from: qualified, event: proposal_requested, to: qualified}
  - {from: qualified, event: proposal_approved, to: proposal}
  - {from: proposal, event: deal_won, to: won}
  - {from: qualified, event: disqualify, to: lost}
  - {from: proposal, event: disqualify, to: lost}
  - {from: new, event: disqualify, to: lost}
policy:
  default_deny: true
  invalid_transition: reject
  protected_events: [proposal_approved, deal_won]
  protected_events_require_approval: true
side_effects:
  proposal_approved: [proposal.prepare]
  deal_won: [odoo.crm_update]
  all_events: [audit.write]
workflow_engine:
  primary: n8n
  state_of_record: Odoo
  local_runtime: backend.app.revenue
idempotency:
  key: lead_id:event
  duplicate_event: no_op
