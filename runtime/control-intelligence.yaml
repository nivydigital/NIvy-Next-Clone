id: phase-12-control-intelligence
version: "1.0"
status: canonical
phase: 12
purpose: Central control-plane intelligence for company state, KPIs, alerts, planning and decision support.
agents: [A092, A093, A094, A095, A096, A097]
controls:
  default_deny: true
  autonomous_mode: false
  protected_actions: [policy.change, workflow.pause, workflow.resume, record.write]
