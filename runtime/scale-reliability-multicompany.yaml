id: phase-17-scale-reliability-multi-company
version: "1.0"
status: canonical
phase: 17
purpose: Reliability, scaling, tenancy isolation, disaster recovery and multi-company operation.
agents: [A122, A123, A124, A125, A126, A127]
controls:
  default_deny: true
  autonomous_mode: false
  protected_actions: [tenant.create, tenant.change, failover, migration, capacity_change]
  approval_required: true
reliability: [health_checks, retries, timeouts, circuit_breakers, idempotency, graceful_degradation]
