id: social-content-pipeline
version: "1.1"
status: implementation
standard: STD-05
trigger: form_or_schedule
name: Social Content Pipeline
policy:
  side_effects: none_until_publish_gate
  dry_run_default: true
  fail_closed: true
  publish_gated: true
dry_run_default: true
idempotency:
  key_template: "social-content:{campaign_id}:{platform}:{period}"
  key_fields: [campaign_id, platform, period]

states:
  - pending
  - strategy
  - generate
  - platform_adapt
  - qa
  - await_approval
  - completed
  - failed
  - cancelled

transitions:
  - {from: pending, to: strategy, on: start}
  - {from: strategy, to: generate, on: strategy_done}
  - {from: generate, to: platform_adapt, on: generated}
  - {from: platform_adapt, to: qa, on: adapted}
  - {from: qa, to: await_approval, on: qa_pass}
  - {from: await_approval, to: completed, on: approved}
  - {from: "*", to: cancelled, on: cancel}
  - {from: "*", to: failed, on: error}

stages:
  - id: social_strategy
    agent: A087
    skill_hint: [SK009, SK010, SK023]
    knowledge_packs: [KP002, KP006]
    input_map:
      marketing_strategy: $.input.marketing_strategy
      content_strategy: $.input.content_strategy
      audience_insights: $.input.audience_insights
      social_constraints: $.input.social_constraints
    output_key: social_strategy
  - id: content_brief
    agent: A085
    skill_hint: [SK009, SK023]
    input_map:
      marketing_strategy: $.input.marketing_strategy
      social_strategy: $.outputs.social_strategy
      content_strategy: $.input.content_strategy
    output_key: brief
  - id: campaign_qa
    agent: A091
    skill_hint: [SK037, SK038]
    input_map:
      draft_plan: $.outputs.brief
      social_strategy: $.outputs.social_strategy
      policy: $.input.policy
    output_key: qa
  - id: approval_gate
    type: gate
    policy: human_approval_before_publish
    detail: No auto-publish to social platforms; dry-run never posts

stop_rules:
  - policy_violation
  - platform_policy_block

side_effects: none
publish_requires: separate_signed_publish_job
cancel_path: true

audit:
  required: true
  events: [workflow.started, stage.completed, approval.requested, workflow.completed, workflow.failed, workflow.cancelled]
