id: lead-outreach
version: "1.0"
status: implementation
name: Lead Discovery to Outreach
description: >
  Priority revenue path: discover → enrich/verify → score → personalize →
  human approval → send → follow-up/triage. Side effects only after approval
  and never in dry_run mode.

trigger:
  types: [manual, schedule]
  default: manual

policy:
  side_effects: gated
  require_approval_before: [tool.email.send]
  dry_run_default: true
  fail_closed: true

idempotency:
  key_template: "lead-outreach:{campaign_id}:{lead_key}"
  lead_key_fields: [email, company, external_id]

states:
  - pending
  - running
  - await_approval
  - approved
  - sending
  - sent
  - following_up
  - done
  - failed
  - cancelled

transitions:
  - {from: pending, to: running, on: start}
  - {from: running, to: await_approval, on: draft_ready}
  - {from: running, to: failed, on: error}
  - {from: await_approval, to: approved, on: approve}
  - {from: await_approval, to: cancelled, on: reject}
  - {from: approved, to: sending, on: send}
  - {from: sending, to: sent, on: send_ok}
  - {from: sending, to: failed, on: send_fail}
  - {from: sent, to: following_up, on: schedule_followup}
  - {from: following_up, to: done, on: complete}
  - {from: following_up, to: await_approval, on: new_draft}
  - {from: "*", to: cancelled, on: cancel}

steps:
  - id: discover
    stage: discover
    agents: [A034, A035]
    description: Lead and contact discovery from approved criteria
    produces: [candidate_leads]

  - id: enrich
    stage: enrich
    agents: [A036]
    description: Enrich lead attributes from approved sources
    consumes: [candidate_leads]
    produces: [enriched_leads]

  - id: quality
    stage: quality
    agents: [A037]
    description: Data quality checks
    consumes: [enriched_leads]
    produces: [quality_report]

  - id: verify
    stage: verify
    agents: [A038]
    tools: [tool.email.verify]
    description: Email/contact verification (mock or Reacher)
    consumes: [enriched_leads]
    produces: [verified_leads]

  - id: score
    stage: score
    agents: [A039]
    description: Lead scoring
    consumes: [verified_leads]
    produces: [scored_leads]

  - id: research
    stage: research
    agents: [A041]
    description: Account research for top-scored leads
    consumes: [scored_leads]
    produces: [account_context]

  - id: plan
    stage: plan
    agents: [A043]
    description: Outreach strategy / sequence plan
    consumes: [account_context, scored_leads]
    produces: [outreach_plan]

  - id: personalize
    stage: personalize
    agents: [A049]
    prompts: [PR004]
    description: Personalization hooks
    consumes: [account_context, outreach_plan]
    produces: [personalization]

  - id: draft
    stage: draft
    agents: [A044]
    prompts: [PR004]
    description: Email draft (never sent in this step)
    consumes: [personalization, outreach_plan]
    produces: [email_draft]
    next_state: await_approval

  - id: approve
    stage: approve
    type: human_gate
    description: Explicit human approval required before send
    consumes: [email_draft]
    produces: [approval]
    next_state: approved

  - id: send
    stage: send
    tools: [tool.email.send]
    description: Deliver email (skipped / mocked when dry_run=true)
    consumes: [email_draft, approval]
    produces: [send_receipt]
    next_state: sent
    requires_approval: true
    skip_when_dry_run: true

  - id: followup
    stage: followup
    agents: [A050]
    description: Schedule or draft follow-up
    consumes: [send_receipt]
    produces: [followup_plan]
    next_state: following_up

  - id: triage
    stage: triage
    agents: [A052]
    prompts: [PR005]
    description: Reply triage if inbound present
    consumes: [inbound_message]
    produces: [triage_result]
    next_state: done
    optional: true

inputs:
  required: [campaign_id]
  optional: [lead_criteria, seed_leads, dry_run, actor]

outputs:
  primary: run_summary
  fields: [state, campaign_id, idempotency_key, steps_completed, dry_run, send_receipt, errors]
