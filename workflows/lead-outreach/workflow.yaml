id: lead-outreach
version: "1.1"
status: implementation
name: Lead Discovery to Outreach
policy:
  side_effects: gated
  require_approval_before: [tool.email.send]
  dry_run_default: true
  fail_closed: true
  skill_contracts: true
idempotency:
  key_template: "lead-outreach:{campaign_id}:{lead_key}"
states: [pending, running, await_approval, approved, sending, sent, following_up, done, failed, cancelled]
steps:
  - {id: discover, agents: [A034, A035], skills: [SK034], prompts: [PR003]}
  - {id: enrich, agents: [A036], skills: [SK036], prompts: [PR003]}
  - {id: quality, agents: [A037], skills: [SK037], prompts: [PR003]}
  - {id: verify, agents: [A038], skills: [SK038], prompts: [PR003], tools: [tool.email.verify]}
  - {id: score, agents: [A039], skills: [SK039], prompts: [PR003]}
  - {id: research, agents: [A041], skills: [SK041], prompts: [PR003]}
  - {id: plan, agents: [A043], skills: [SK043], prompts: [PR002]}
  - {id: personalize, agents: [A049], skills: [SK049], prompts: [PR004]}
  - {id: draft, agents: [A044], skills: [SK044], prompts: [PR004], next_state: await_approval}
  - {id: approve, type: human_gate, next_state: approved}
  - {id: send, tools: [tool.email.send], requires_approval: true, skip_when_dry_run: true, next_state: sent}
  - {id: followup, agents: [A050], skills: [SK050], prompts: [PR005], next_state: following_up}
  - {id: triage, agents: [A052], prompts: [PR005], optional: true, next_state: done}
